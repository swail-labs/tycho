[project]
# Distribution name: `tycho` is taken on PyPI by an unrelated project, so we publish as
# `tycho-cli` (TYCHO-73). The import package and the console script stay `tycho`.
name = "tycho-cli"
dynamic = ["version"]  # single source of truth: tycho/__init__.py:__version__
description = "Tycho — a free, offline, open-source local verifier that proves an AI agent actually did what it claims, from git, the filesystem, process exit codes, and the harness event stream. No account, no LLM in the trust path."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["ai", "agents", "verification", "claude-code", "cursor", "codex", "deterministic", "independent", "local", "offline", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://swail.dev"
Repository = "https://github.com/swail-labs/tycho"
Issues = "https://github.com/swail-labs/tycho/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1"]  # build: sdist E2E (TYCHO-37)

[project.scripts]
tycho = "tycho.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tycho/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tycho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "advisory: exercises the optional LLM advisory checks; needs a user model key or Ollama (skipped otherwise)",
    "e2e: builds the wheel + sdist and installs each into a clean venv; slow, and needs an index to build (`-m 'not e2e'` to skip)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
